services:
  spoty-loop:
    # Pin a release tag (or an immutable sha-<commit> tag) instead of latest.
    image: ghcr.io/ozard-02/music_loop:${SPOTY_LOOP_TAG:-1.2.1}
    container_name: spoty-loop
    env_file: .env
    environment:
      - QUEUE_DB_PATH=/root/.spotiflac/queue.db
      - MALLOC_ARENA_MAX=2
      # One container: the API runs in a daemon thread inside bot.py.
      - RUN_API=1
    volumes:
      # Adjust the pool name (TB2 in the reference deployment) if needed.
      - /mnt/${TRUENAS_POOL:-TB2}/navidrome/Music:/root/Music
      - /mnt/${TRUENAS_POOL:-TB2}/VM/spotiflac:/root/.spotiflac
    ports:
      - "8099:8099"
    restart: unless-stopped
