services:
  spoty-loop:
    # Pin a release tag (or an immutable sha-<commit> tag) instead of latest.
    image: ghcr.io/ozard-02/music_loop:${SPOTY_LOOP_TAG:-1.1.0}
    container_name: spoty-loop
    env_file: .env
    environment:
      - QUEUE_DB_PATH=/root/.spotiflac/queue.db
      - MALLOC_ARENA_MAX=2
      # One container: the API runs in a daemon thread inside bot.py.
      - RUN_API=1
    volumes:
      - /mnt/pool/navidrome/Music:/root/Music
      - /mnt/pool/VM/spotiflac:/root/.spotiflac
    ports:
      - "8099:8099"
    restart: unless-stopped
