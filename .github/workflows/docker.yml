name: Build & Push Docker Image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # A PAT with write:packages is required to (re)create the package
          # after it was deleted. GITHUB_TOKEN cannot bootstrap a previously
          # deleted package name (GHCR returns permission_denied: write_package).
          # Once the package exists and is linked to this repo, GITHUB_TOKEN
          # can be used for subsequent pushes.
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/ozard-02/music_loop:latest
