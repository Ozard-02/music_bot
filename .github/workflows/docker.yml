name: Build & Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    # Workflow-only changes do not alter the image; skip the build (and the
    # extra GHCR version). Tag pushes are not filtered by paths.
    paths-ignore:
      - ".github/workflows/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests/ -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # A PAT with write:packages is required to (re)create the package
          # after it was deleted. GITHUB_TOKEN cannot bootstrap a previously
          # deleted package name (GHCR returns permission_denied: write_package).
          # Once the package exists and is linked to this repo, GITHUB_TOKEN
          # can be used for subsequent pushes.
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ozard-02/music_loop
          tags: |
            # Immutable per-commit tag for every main build.
            type=sha,format=short,prefix=sha-
            # Semver tags from Git tags like v1.2.3.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `latest` only on release tags, never on plain main pushes.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
