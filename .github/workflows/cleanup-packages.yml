name: Cleanup old container versions

on:
  schedule:
    - cron: "0 3 * * 0"  # every Sunday at 03:00 UTC
  workflow_dispatch:
    inputs:
      min-versions-to-keep:
        description: "Newest versions to keep (use 3 once to drop the pre-rewrite images)"
        required: false
        default: "10"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Purge pre-rewrite images
        uses: actions/github-script@v7
        with:
          script: |
            // Images built before the 2026-11-12 history rewrite may still
            // contain personal data. Delete them on every run; the three
            // clean images are newer than this cutoff.
            const cutoff = new Date("2026-11-12T18:00:00Z");
            const owner = context.repo.owner;
            const versions = await github.paginate(
              github.rest.packages.getAllPackageVersionsForPackageOwnedByUser,
              {
                username: owner,
                package_type: "container",
                package_name: "music_loop",
                per_page: 100,
              }
            );
            for (const version of versions) {
              if (new Date(version.created_at) < cutoff) {
                core.info(`Deleting pre-rewrite version ${version.id} (${version.created_at})`);
                await github.rest.packages.deletePackageVersionForUser({
                  username: owner,
                  package_type: "container",
                  package_name: "music_loop",
                  package_version_id: version.id,
                });
              }
            }

      - name: Delete old images
        uses: actions/delete-package-versions@v5
        # Known edge case: if every version gets removed, GHCR deletes the
        # package too and the action then fails with "Package not found".
        # That is harmless (the next image push recreates it).
        continue-on-error: true
        with:
          package-name: music_loop
          package-type: container
          # Scheduled runs keep 10. Manual runs can use 3 once to remove the
          # two pre-rewrite images while keeping the three clean ones.
          min-versions-to-keep: ${{ github.event.inputs.min-versions-to-keep || 10 }}
