name: Cleanup old container versions

on:
  schedule:
    - cron: "0 3 * * 0"  # every Sunday at 03:00 UTC
  workflow_dispatch:
    inputs:
      min-versions-to-keep:
        description: "Newest versions to keep (use 4 once to drop the pre-rewrite images)"
        required: false
        default: "10"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old images
        uses: actions/delete-package-versions@v5
        # Known edge case: if every version gets removed, GHCR deletes the
        # package too and the action then fails with "Package not found".
        # That is harmless (the next image push recreates it).
        continue-on-error: true
        with:
          package-name: music_loop
          package-type: container
          # Scheduled runs keep 10. Manual runs can use 4 once to remove the
          # two pre-rewrite images (the three clean ones + the new main build).
          min-versions-to-keep: ${{ github.event.inputs.min-versions-to-keep || 10 }}
